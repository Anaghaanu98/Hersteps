<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Login | HerSteps</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #07080f;
            --panel: rgba(16, 18, 32, .72);
            --line: rgba(255, 255, 255, .09);
            --text: #f4f5ff;
            --muted: #9aa0c3;
            --primary: #6c5ffc;
            --primary-soft: #9d8cff;
            --accent: #19e0c0;
            --danger: #ff6b76;
            --heading: "Sora", "Plus Jakarta Sans", Arial, sans-serif;
        }

        *, *::before, *::after { box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            margin: 0;
            font-family: "Plus Jakarta Sans", Arial, sans-serif;
            font-size: 15px;
            color: var(--text);
            background: var(--bg);
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }
        ::selection { background: rgba(108, 95, 252, .45); }

        /* ================= Animated background ================= */
        .bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }

        .bg-grid {
            position: absolute; inset: -2px;
            background-image:
                linear-gradient(rgba(255, 255, 255, .045) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, .045) 1px, transparent 1px);
            background-size: 56px 56px;
            -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 45%, #000 30%, transparent 100%);
                    mask-image: radial-gradient(ellipse 70% 60% at 50% 45%, #000 30%, transparent 100%);
            animation: gridDrift 24s linear infinite;
        }

        .orb { position: absolute; border-radius: 50%; filter: blur(80px); opacity: .55; will-change: transform; }
        .orb-1 { width: 460px; height: 460px; top: -140px; left: -120px; background: var(--primary); animation: float1 16s ease-in-out infinite; }
        .orb-2 { width: 380px; height: 380px; right: -110px; bottom: -120px; background: #3a2bd8; animation: float2 19s ease-in-out infinite; }
        .orb-3 { width: 240px; height: 240px; top: 55%; left: 58%; background: var(--accent); opacity: .22; animation: float3 22s ease-in-out infinite; }

        .spark {
            position: absolute; bottom: -10px;
            width: 3px; height: 3px; border-radius: 50%;
            background: #fff; opacity: 0;
            box-shadow: 0 0 10px 2px rgba(157, 140, 255, .9);
            animation: rise linear infinite;
        }
        .spark:nth-child(1) { left: 8%;  animation-duration: 11s; animation-delay: 0s; }
        .spark:nth-child(2) { left: 22%; animation-duration: 14s; animation-delay: 2s; }
        .spark:nth-child(3) { left: 37%; animation-duration: 10s; animation-delay: 5s; }
        .spark:nth-child(4) { left: 52%; animation-duration: 15s; animation-delay: 1s; }
        .spark:nth-child(5) { left: 66%; animation-duration: 12s; animation-delay: 4s; }
        .spark:nth-child(6) { left: 79%; animation-duration: 13s; animation-delay: 7s; box-shadow: 0 0 10px 2px rgba(25, 224, 192, .9); }
        .spark:nth-child(7) { left: 91%; animation-duration: 16s; animation-delay: 3s; }

        /* ================= Layout ================= */
        .admin-login-page {
            position: relative; z-index: 1;
            min-height: 100vh; min-height: 100dvh;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            gap: 22px;
            padding: 32px 18px;
        }

        /* ================= Card ================= */
        .admin-login-card {
            --mx: 50%; --my: 0%;
            position: relative;
            width: 100%; max-width: 440px;
            padding: 40px 36px 30px;
            border-radius: 28px;
            background: var(--panel);
            border: 1px solid var(--line);
            -webkit-backdrop-filter: blur(22px) saturate(140%);
                    backdrop-filter: blur(22px) saturate(140%);
            box-shadow: 0 40px 80px -30px rgba(0, 0, 0, .85), inset 0 1px 0 rgba(255, 255, 255, .08);
            animation: cardIn .9s cubic-bezier(.2, .8, .2, 1) both;
            isolation: isolate;
        }

        /* cursor-following spotlight */
        .admin-login-card::before {
            content: ""; position: absolute; inset: 0; z-index: -1;
            border-radius: inherit;
            background: radial-gradient(360px circle at var(--mx) var(--my), rgba(108, 95, 252, .22), transparent 60%);
            transition: background .15s ease;
        }

        /* rotating gradient border */
        .admin-login-card::after {
            content: ""; position: absolute; inset: -1px; z-index: -2;
            border-radius: inherit; padding: 1px;
            background: conic-gradient(from var(--angle, 0deg), transparent 0deg, var(--primary) 70deg, var(--accent) 130deg, transparent 200deg, transparent 360deg);
            -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            -webkit-mask-composite: xor;
                    mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
            opacity: .9;
            animation: spin 6s linear infinite;
        }
        @property --angle { syntax: "<angle>"; initial-value: 0deg; inherits: false; }

        /* ================= Brand ================= */
        .login-brand { display: flex; flex-direction: column; align-items: center; margin-bottom: 28px; animation: fadeUp .7s .15s both; }
        .login-brand h2 {
            margin: 0;
            font-family: var(--heading);
            font-size: 30px; font-weight: 700; letter-spacing: -.5px;
            color: #fff;
        }
        .login-brand h2 span { color: var(--accent); text-shadow: 0 0 18px rgba(25, 224, 192, .9); animation: blink 2.4s ease-in-out infinite; }
        .login-brand p {
            margin: 10px 0 0;
            padding: 5px 14px;
            border-radius: 999px;
            border: 1px solid var(--line);
            background: rgba(255, 255, 255, .05);
            font-size: 10px; font-weight: 700; letter-spacing: 2.4px; color: var(--primary-soft);
        }

        /* ================= Heading ================= */
        .login-heading { text-align: center; margin-bottom: 26px; }
        .login-heading .eyebrow {
            display: inline-flex; align-items: center; gap: 9px;
            margin: 0 0 10px;
            font-size: 11px; font-weight: 700; letter-spacing: 2px; color: var(--muted);
            animation: fadeUp .7s .25s both;
        }
        .login-heading .eyebrow::before {
            content: ""; width: 7px; height: 7px; border-radius: 50%;
            background: var(--accent); box-shadow: 0 0 0 0 rgba(25, 224, 192, .7);
            animation: pulse 2s ease-out infinite;
        }
        .login-heading h1 {
            margin: 0;
            font-family: var(--heading);
            font-size: 36px; font-weight: 700; line-height: 1.1; letter-spacing: -1px;
            background: linear-gradient(90deg, #fff 0%, #cfc8ff 40%, #fff 60%, #fff 100%);
            background-size: 220% 100%;
            -webkit-background-clip: text; background-clip: text;
            -webkit-text-fill-color: transparent; color: transparent;
            animation: fadeUp .7s .33s both, shine 5s 1.2s linear infinite;
        }
        .login-subtitle { margin: 12px 0 0; color: var(--muted); font-size: 14.5px; line-height: 1.6; animation: fadeUp .7s .41s both; }

        /* ================= Messages ================= */
        .login-messages { margin-bottom: 18px; }
        .login-message {
            margin: 0 0 8px;
            padding: 12px 16px;
            border-radius: 14px;
            border: 1px solid rgba(255, 107, 118, .35);
            border-left: 4px solid var(--danger);
            background: rgba(255, 107, 118, .1);
            color: #ffc2c7;
            font-size: 13.5px; font-weight: 500;
            animation: shake .5s .1s both, fadeUp .4s both;
        }

        /* ================= Form ================= */
        .admin-login-form { display: grid; gap: 20px; }

        .form-group { position: relative; animation: fadeUp .7s both; }
        .form-group:nth-of-type(1) { animation-delay: .5s; }
        .form-group:nth-of-type(2) { animation-delay: .58s; }

        .form-group label {
            display: block; margin-bottom: 8px;
            font-size: 11px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase;
            color: var(--muted);
            transition: color .2s ease;
        }
        .form-group:focus-within label { color: var(--accent); }

        .field { position: relative; }
        .field .field-icon {
            position: absolute; top: 50%; left: 16px; transform: translateY(-50%);
            width: 19px; height: 19px;
            fill: none; stroke: var(--muted); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
            pointer-events: none; transition: stroke .2s ease, transform .25s ease;
        }
        .form-group:focus-within .field-icon { stroke: var(--accent); transform: translateY(-50%) scale(1.1); }

        .form-group input {
            width: 100%; height: 54px;
            padding: 0 16px 0 46px;
            border: 1.5px solid var(--line);
            border-radius: 14px;
            background: rgba(255, 255, 255, .04);
            color: #fff;
            font-family: inherit; font-size: 15px;
            transition: border-color .25s ease, background .25s ease, box-shadow .25s ease, transform .25s ease;
        }
        .form-group input::placeholder { color: #666c8f; }
        .form-group input:hover { border-color: rgba(255, 255, 255, .2); }
        .form-group input:focus {
            outline: none;
            border-color: var(--primary-soft);
            background: rgba(108, 95, 252, .08);
            box-shadow: 0 0 0 4px rgba(108, 95, 252, .22), 0 12px 30px -14px rgba(108, 95, 252, .8);
            transform: translateY(-1px);
        }
        .form-group input:-webkit-autofill {
            -webkit-text-fill-color: #fff;
            box-shadow: 0 0 0 100px #14172b inset;
            caret-color: #fff;
        }
        #password { padding-right: 52px; }

        .toggle-pass {
            position: absolute; top: 50%; right: 8px; transform: translateY(-50%);
            width: 38px; height: 38px;
            display: grid; place-items: center;
            border: 0; border-radius: 10px;
            background: transparent; color: var(--muted); cursor: pointer;
            transition: background .2s ease, color .2s ease;
        }
        .toggle-pass:hover { background: rgba(255, 255, 255, .08); color: #fff; }
        .toggle-pass:focus-visible { outline: 2px solid var(--primary-soft); }
        .toggle-pass svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
        .toggle-pass .eye-off { display: none; }
        .toggle-pass.is-shown .eye-on { display: none; }
        .toggle-pass.is-shown .eye-off { display: block; }

        /* ================= Button ================= */
        .login-button {
            position: relative; overflow: hidden;
            display: inline-flex; align-items: center; justify-content: center; gap: 10px;
            width: 100%; height: 56px;
            margin-top: 6px;
            border: 0; border-radius: 14px;
            background: linear-gradient(120deg, #5b50f0 0%, #8b6cff 50%, #5b50f0 100%);
            background-size: 220% 100%;
            color: #fff;
            font-family: inherit; font-size: 15.5px; font-weight: 700; letter-spacing: .4px;
            cursor: pointer;
            box-shadow: 0 18px 36px -14px rgba(108, 95, 252, .95), inset 0 1px 0 rgba(255, 255, 255, .25);
            transition: transform .25s ease, box-shadow .3s ease, background-position .6s ease;
            animation: fadeUp .7s .66s both;
        }
        .login-button::before {
            content: ""; position: absolute; top: 0; bottom: 0; left: -60%;
            width: 40%;
            background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .45), transparent);
            transform: skewX(-20deg);
            animation: sweep 3.6s 1.5s ease-in-out infinite;
        }
        .login-button .arrow { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; transition: transform .25s ease; }
        .login-button:hover { transform: translateY(-3px); background-position: 100% 0; box-shadow: 0 24px 44px -14px rgba(108, 95, 252, 1), 0 0 0 1px rgba(255, 255, 255, .12), inset 0 1px 0 rgba(255, 255, 255, .3); }
        .login-button:hover .arrow { transform: translateX(5px); }
        .login-button:active { transform: translateY(-1px) scale(.99); }
        .login-button:focus-visible { outline: 3px solid rgba(157, 140, 255, .7); outline-offset: 3px; }

        .login-button .spinner {
            display: none; width: 20px; height: 20px;
            border: 2.5px solid rgba(255, 255, 255, .35); border-top-color: #fff;
            border-radius: 50%; animation: spin 0.7s linear infinite;
        }
        .login-button.is-loading { pointer-events: none; opacity: .92; }
        .login-button.is-loading .spinner { display: inline-block; }
        .login-button.is-loading .arrow { display: none; }

        /* ================= Footer ================= */
        .login-footer { display: flex; align-items: center; gap: 14px; margin-top: 26px; animation: fadeUp .7s .75s both; }
        .login-footer p { margin: 0; white-space: nowrap; font-size: 11.5px; letter-spacing: .8px; color: #6e7499; }
        .footer-line { flex: 1; height: 1px; background: linear-gradient(90deg, transparent, var(--line), transparent); }

        .page-note {
            margin: 0; text-align: center;
            font-size: 12.5px; color: #6e7499;
            animation: fadeUp .7s .9s both;
        }
        .page-note::before { content: "🔒︎ "; filter: grayscale(1); }

        /* ================= Keyframes ================= */
        @keyframes cardIn { from { opacity: 0; transform: translateY(40px) scale(.96); filter: blur(8px); } to { opacity: 1; transform: none; filter: none; } }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
        @keyframes spin { to { --angle: 360deg; transform: none; } }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(25, 224, 192, .7); } 70%, 100% { box-shadow: 0 0 0 9px rgba(25, 224, 192, 0); } }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
        @keyframes shine { to { background-position: -220% 0; } }
        @keyframes sweep { 0% { left: -60%; } 40%, 100% { left: 140%; } }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-7px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }
        @keyframes gridDrift { to { background-position: 56px 56px, 56px 56px; } }
        @keyframes float1 { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(90px, 70px); } }
        @keyframes float2 { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(-80px, -60px); } }
        @keyframes float3 { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(-60px, 40px) scale(1.25); } }
        @keyframes rise { 0% { transform: translateY(0); opacity: 0; } 10% { opacity: .9; } 90% { opacity: .7; } 100% { transform: translateY(-105vh); opacity: 0; } }

        /* The border uses a registered angle; the spin keyframe above animates it.
           Fallback for the loading spinner uses a plain rotate. */
        .login-button .spinner { animation-name: rotate; }
        @keyframes rotate { to { transform: rotate(360deg); } }

        /* ================= Responsive ================= */
        @media (max-width: 520px) {
            .admin-login-page { padding: 22px 14px; justify-content: flex-start; padding-top: 7vh; }
            .admin-login-card { padding: 32px 22px 24px; border-radius: 24px; }
            .login-heading h1 { font-size: 30px; }
            .login-brand h2 { font-size: 26px; }
            .orb-1 { width: 320px; height: 320px; }
            .orb-2 { width: 280px; height: 280px; }
        }
        @media (max-height: 640px) and (min-width: 521px) {
            .admin-login-page { justify-content: flex-start; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation: none !important; transition: none !important; }
            .login-heading h1 { -webkit-text-fill-color: #fff; color: #fff; background: none; }
        }
    </style>
</head>
<body>

<!-- Animated background -->
<div class="bg" aria-hidden="true">
    <div class="bg-grid"></div>
    <span class="orb orb-1"></span>
    <span class="orb orb-2"></span>
    <span class="orb orb-3"></span>
    <span class="spark"></span><span class="spark"></span><span class="spark"></span><span class="spark"></span>
    <span class="spark"></span><span class="spark"></span><span class="spark"></span>
</div>

<div class="admin-login-page">

    <div class="admin-login-card" id="loginCard">

        <div class="login-brand">
            <h2>HerSteps<span>.</span></h2>
            <p>ADMIN PANEL</p>
        </div>

        <div class="login-heading">
            <p class="eyebrow">WELCOME BACK</p>
            <h1>Admin Login</h1>
            <p class="login-subtitle">
                Sign in to manage your HerSteps store.
            </p>
        </div>

        {% if messages %}
        <div class="login-messages" aria-live="polite">
            {% for message in messages %}
            <p class="login-message">{{ message }}</p>
            {% endfor %}
        </div>
        {% endif %}

        <form method="post" class="admin-login-form" id="loginForm">
            {% csrf_token %}

            <div class="form-group">
                <label for="username">Username</label>
                <div class="field">
                    <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter your username"
                        autocomplete="username"
                        required
                        autofocus
                    >
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="field">
                    <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >
                    <button type="button" class="toggle-pass" id="togglePass" aria-label="Show password" aria-pressed="false">
                        <svg class="eye-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                        <svg class="eye-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                    </button>
                </div>
            </div>

            <button type="submit" class="login-button" id="loginBtn">
                <span class="label">Sign In</span>
                <svg class="arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
                <span class="spinner" aria-hidden="true"></span>
            </button>
        </form>

        <div class="login-footer">
            <span class="footer-line"></span>
            <p>HerSteps · Admin Access</p>
            <span class="footer-line"></span>
        </div>

    </div>

    <p class="page-note">
        Secure access for HerSteps administrators
    </p>

</div>

<script>
(function () {
    var card = document.getElementById("loginCard");
    var form = document.getElementById("loginForm");
    var btn = document.getElementById("loginBtn");
    var pass = document.getElementById("password");
    var toggle = document.getElementById("togglePass");

    // Cursor-following spotlight on the card
    card.addEventListener("pointermove", function (e) {
        var r = card.getBoundingClientRect();
        card.style.setProperty("--mx", (e.clientX - r.left) + "px");
        card.style.setProperty("--my", (e.clientY - r.top) + "px");
    });

    // Show / hide password (display only, form data is untouched)
    toggle.addEventListener("click", function () {
        var show = pass.type === "password";
        pass.type = show ? "text" : "password";
        toggle.classList.toggle("is-shown", show);
        toggle.setAttribute("aria-pressed", show ? "true" : "false");
        toggle.setAttribute("aria-label", show ? "Hide password" : "Show password");
        pass.focus();
    });

    // Loading state on submit (does not block or alter the normal form post)
    form.addEventListener("submit", function () {
        if (form.checkValidity()) { btn.classList.add("is-loading"); }
    });

    // Restore the button if the page is restored from the back/forward cache
    window.addEventListener("pageshow", function (e) {
        if (e.persisted) { btn.classList.remove("is-loading"); }
    });
})();
</script>

</body>
</html>
