
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}HerSteps{% endblock %}</title>

    <style>
        :root {
            --page-bg: #fff8f4;
            --outer-bg: #e3cecc;
            --peach: #fff0e5;
            --brown: #99420a;
            --orange: #c9652a;
            --text: #342922;
            --muted: #897d75;
            --border: #f0e1d8;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--page-bg);
            color: var(--text);
            font-family: Arial, sans-serif;
        }

        .site-shell {
            min-height: 100vh;
            padding: 28px 4%;
            background: var(--outer-bg);
        }

        .site-label {
            margin: 0 0 12px;
            color: #756966;
            font-size: 19px;
        }

        .page {
            min-height: calc(100vh - 90px);
            background: var(--page-bg);
            padding: 28px;
        }

        .back-link {
            color: #6d5548;
            text-decoration: none;
            font-size: 13px;
        }

        .auth-card {
            width: 100%;
            max-width: 490px;
            margin: 30px auto;
            padding: 38px 40px;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 10px 24px rgba(70, 42, 25, 0.08);
        }

        .auth-card.verify-card {
            max-width: 380px;
            margin-top: 45px;
            border: 1px solid var(--border);
            box-shadow: none;
        }

        .brand {
            text-align: center;
            margin-bottom: 20px;
        }

        .brand-name {
            font-family: Georgia, serif;
            font-size: 25px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .brand-mark {
            color: var(--orange);
            font-size: 27px;
        }

        .brand-tagline {
            display: block;
            font-size: 8px;
            letter-spacing: 2px;
            color: var(--muted);
        }

        .eyebrow {
            text-align: center;
            font-size: 10px;
            font-weight: bold;
            letter-spacing: 2px;
            color: var(--muted);
        }

        h1 {
            margin: 12px 0;
            text-align: center;
            font-family: Georgia, serif;
            font-weight: normal;
            font-size: 29px;
        }

        .subtitle {
            margin: 0 auto 24px;
            color: var(--muted);
            text-align: center;
            font-size: 13px;
            line-height: 1.7;
        }

        .form-group { margin-bottom: 15px; }

        .form-label {
            display: block;
            margin-bottom: 7px;
            font-size: 12px;
            font-weight: 600;
        }

        .form-input {
            width: 100%;
            height: 43px;
            padding: 0 14px;
            border: 1px solid transparent;
            border-radius: 11px;
            background: var(--peach);
            color: var(--text);
            font-size: 13px;
        }

        .form-input:focus {
            outline: 2px solid #d8a17d;
            outline-offset: 1px;
        }

        .password-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .text-link {
            color: var(--brown);
            text-decoration: none;
            font-size: 12px;
        }

        .primary-btn, .secondary-btn {
            width: 100%;
            min-height: 43px;
            border: 0;
            border-radius: 11px;
            padding: 12px;
            cursor: pointer;
            font-size: 13px;
        }

        .primary-btn {
            color: #fff;
            background: var(--brown);
            box-shadow: 0 3px 5px #00000018;
        }

        .secondary-btn {
            color: var(--text);
            background: var(--peach);
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 20px 0;
            color: var(--muted);
            font-size: 10px;
        }

        .divider::before, .divider::after {
            content: "";
            height: 1px;
            flex: 1;
            background: var(--border);
        }

        .bottom-note {
            margin-top: 24px;
            padding-top: 22px;
            border-top: 1px solid var(--border);
            text-align: center;
            color: var(--muted);
            font-size: 12px;
        }

        .message {
            margin: 12px 0;
            padding: 11px;
            border-radius: 8px;
            background: #fff0e5;
            font-size: 13px;
        }

        .field-error {
            display: block;
            margin-top: 5px;
            color: #a32d22;
            font-size: 12px;
        }

        .otp-input {
            width: 100%;
            height: 54px;
            margin: 14px 0;
            border: 1px solid var(--border);
            border-radius: 11px;
            background: #fff8f4;
            text-align: center;
            font-size: 25px;
            letter-spacing: 12px;
            padding-left: 20px;
        }

        .resend-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px;
            margin: 16px 0 22px;
            color: var(--muted);
            font-size: 11px;
        }

        @media (max-width: 600px) {
            .site-shell { padding: 12px; }
            .page { padding: 16px 10px; min-height: 95vh; }
            .auth-card { padding: 28px 22px; margin-top: 24px; }
            h1 { font-size: 26px; }
        }
    </style>
    {% block extra_head %}{% endblock %}
    {% block extra_css %}{% endblock %}
</head>

<body>
    {% block layout %}
    <div class="site-shell">
        <p class="site-label">hersteps</p>

        <main class="page">
            {% block back_link %}{% endblock %}

            {% if messages %}
                <div aria-live="polite">
                    {% for message in messages %}
                        <div class="message">{{ message }}</div>
                    {% endfor %}
                </div>
            {% endif %}

            {% block content %}{% endblock %}
        </main>
    </div>
    {% endblock %}
</body>
</html>
